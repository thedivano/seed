name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe.py
      - run: |
          git config user.name seed-bot; git config user.email seed-bot@users.noreply.github.com
          git add probe.json && git commit -m probe && git push
