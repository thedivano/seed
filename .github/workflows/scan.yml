name: 종목 발굴

on:
  schedule:
    - cron: "50 6 * * 1-5"   # 평일 한국시간 15:50 (정규장 마감 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 코스피·코스닥 전체 훑기
        run: python scan.py

      - name: 발굴 기록 저장
        run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add state/found.json state/themes.json 2>/dev/null || git add state/found.json
          if ! git diff --cached --quiet; then
            git commit -qm "발굴 기록 업데이트"
            for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q && break; sleep 5; done
          fi

      - name: 시드 페이지용 chart-data 브랜치에도 넣기
        run: |
          cp state/found.json /tmp/found.json; cp state/themes.json /tmp/themes.json 2>/dev/null || true
          for i in 1 2 3; do
            rm -rf /tmp/cd
            git clone -q --depth 1 -b chart-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/cd || exit 0
            cp /tmp/found.json /tmp/cd/found.json; [ -f /tmp/themes.json ] && cp /tmp/themes.json /tmp/cd/themes.json
            cd /tmp/cd
            git add found.json; [ -f themes.json ] && git add themes.json
            git diff --cached --quiet && exit 0
            git -c user.name=seed-bot -c user.email=seed-bot@users.noreply.github.com commit -qm "발굴 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git push -q && exit 0
            cd - >/dev/null; sleep 5
          done
