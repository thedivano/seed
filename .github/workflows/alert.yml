name: 관심종목 감시

on:
  schedule:
    # 평일 한국시간 08:00~20:00, 20분마다 (GitHub는 UTC 기준, 한국시간 = UTC+9)
    - cron: "*/20 23 * * 0-4"   # 08:00, 08:20, 08:40
    - cron: "*/20 0-10 * * 1-5" # 09:00 ~ 19:40
    - cron: "0 11 * * 1-5"      # 20:00 마지막 확인
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기 (지금 상태를 바로 알림으로)"
        type: boolean
        default: true
      chart_only:
        description: "알림 없이 차트 데이터만 갱신"
        type: boolean
        default: false
      image_test_topic:
        description: "(점검용) 차트 이미지 알림을 보낼 임시 토픽"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 조건 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          CHART_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_only && '1' || '0' }}
          IMAGE_TEST_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.image_test_topic || '' }}
        run: python alert.py

      - name: 알림 기록 저장
        run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add state/sent.json
          if ! git diff --cached --quiet; then
            git commit -m "알림 기록 업데이트"
            git pull --rebase -q origin main && git push
          fi

      - name: 차트 데이터를 chart-data 브랜치에 덮어쓰기 (시드 페이지용)
        run: |
          [ -f data/chart.json ] || exit 0
          mkdir -p /tmp/chart && cp data/*.json /tmp/chart/ && cd /tmp/chart
          git init -q -b chart-data
          git add *.json
          git -c user.name=seed-bot -c user.email=seed-bot@users.noreply.github.com commit -qm "차트 데이터 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" chart-data
