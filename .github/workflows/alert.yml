name: 관심종목 감시

on:
  schedule:
    # GitHub는 UTC 기준 (한국시간 = UTC+9)
    - cron: "*/30 23 * * 0-4"   # 08:00~08:30 프리마켓, 30분마다
    - cron: "*/15 0-6 * * 1-5"  # 09:00~15:45 정규장, 15분마다
    - cron: "*/30 7-10 * * 1-5" # 16:00~19:30 애프터마켓, 30분마다
    - cron: "0 11 * * 1-5"      # 20:00 마지막 확인
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기 (지금 상태를 바로 알림으로)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 조건 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python alert.py

      - name: 오늘 보낸 알림 기록 저장
        run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "알림 기록 업데이트" && git push)
