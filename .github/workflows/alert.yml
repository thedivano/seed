name: 관심종목 감시

on:
  schedule:
    # 평일 한국시간 08:00~20:00, 20분마다 (GitHub는 UTC 기준, 한국시간 = UTC+9)
    - cron: "*/20 23 * * 0-4"   # 08:00, 08:20, 08:40
    - cron: "*/20 0-10 * * 1-5" # 09:00 ~ 19:40
    - cron: "0 11 * * 1-5"      # 20:00 마지막 확인
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기 (지금 상태를 바로 알림으로)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 조건 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python alert.py

      - name: 알림 기록과 차트 데이터 저장
        run: |
          git config user.name "seed-bot"
          git config user.email "seed-bot@users.noreply.github.com"
          git add state/sent.json data/chart.json 2>/dev/null || git add state/sent.json
          git diff --cached --quiet || (git commit -m "알림 기록·차트 데이터 업데이트" && git push)
