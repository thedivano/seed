; 이 파일을 복사해서 이름을 config.ini 로 바꾸고 채워 주세요.
; config.ini 는 이 PC에만 두고 GitHub 에 올리지 마세요. (자동으로 제외돼요)

[kis]
; 한국투자증권 KIS Developers 에서 받은 앱키와 시크릿키
; 비워두면 실시간 시세 없이 1분마다 네이버 시세로만 확인해요
appkey =
secretkey =
; 실시간 체결가 TR ID. 기본은 거래소(KRX) 정규장 체결가예요.
; 넥스트레이드(NXT)까지 합친 통합 체결가 TR ID 가 있다면 KIS 문서에서 확인해 바꿔 넣으세요.
tr_id = H0STCNT0
ws_url = ws://ops.koreainvestment.com:21000
rest_url = https://openapi.koreainvestment.com:9443

[ntfy]
; 폰 ntfy 앱에서 구독한 토픽 이름 (GitHub Secrets 의 NTFY_TOPIC 과 같은 값)
topic =

[github]
; seed 저장소의 watchlist.csv 를 읽기 위한 토큰 (읽기 전용, seed 저장소만)
; 비워두면 이 폴더 위에 있는 watchlist.csv 를 그대로 써요
token =
repo = thedivano/seed
